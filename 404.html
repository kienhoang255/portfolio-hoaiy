<!DOCTYPE html>
<html>

<head>
    <script>
        var l = window.location;
        var path = l.pathname.replace('/portfolio-hoaiy', '').replace(/^\//, '');
        var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
        l.replace(l.origin + '/portfolio-hoaiy/?/' + path + query + l.hash);
    </script>
</head>

</html>
